<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophie Rodier - Choisissez votre cabinet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], handwritten: ['Caveat', 'cursive'] },
                    colors: { sr: { black: '#18181B', blue: '#1E3A8A', orange: '#EA580C', green: '#059669', pink: '#E11D48', yellow: '#D97706', bgLight: '#FAF9F6' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-sr-bgLight text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <!-- Décoration de fond (Cercles) -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-sr-blue/10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2 pointer-events-none z-0"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-sr-orange/10 rounded-full blur-3xl translate-x-1/2 translate-y-1/2 pointer-events-none z-0"></div>

    <!-- NOUVEAU : Villes en fond (en bas, fusionnées au centre) -->
    <div class="absolute bottom-0 left-0 w-full flex items-end z-0 pointer-events-none opacity-40 overflow-hidden">
        <!-- Effet miroir, agrandissement et décalage vers le bas pour la ville de gauche -->
        <img src="images/ville-gauche.jpg" class="w-1/2 object-cover object-bottom -scale-x-100 translate-y-12 md:translate-y-24 scale-110">
        <img src="images/ville-droite.jpg" class="w-1/2 object-contain object-bottom relative z-10">
    </div>

    <!-- Contenu Principal -->
    <div class="relative z-10 w-full max-w-5xl mx-auto px-6 py-12 text-center">
        
        <!-- Logo Principal -->
        <div class="mb-16 flex flex-col items-center">
            <img src="images/logo-principal.png" alt="Sophie Rodier" class="h-24 md:h-32 w-auto mix-blend-multiply mb-6">
            <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-4">Bienvenue chez Sophie Rodier</h1>
            <p class="text-lg text-slate-600 max-w-2xl mx-auto">Veuillez sélectionner le cabinet de votre choix pour accéder à nos services d'expertise comptable et de conseil.</p>
        </div>

        <!-- Les deux cartes de choix -->
        <div class="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
            
            <!-- Carte Saint-Affrique -->
            <a href="saint-affrique.html" class="group bg-white p-10 rounded-3xl shadow-lg border border-slate-200 hover:shadow-2xl hover:-translate-y-2 hover:border-sr-blue transition-all duration-300 text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-sr-blue translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-in-out opacity-5"></div>
                <!-- LOGO AGRANDI : w-32 h-32 au lieu de w-24 h-24 -->
                <div class="w-32 h-32 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto mb-6 p-3 group-hover:scale-110 transition-transform duration-300">
                    <img src="images/logo-st-affrique.jpg" alt="Logo Saint-Affrique" class="h-full w-auto object-contain mix-blend-multiply">
                </div>
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Cabinet de Saint-Affrique</h2>
                <p class="text-slate-500 text-sm mb-6">10B, boulevard de Verdun<br>12400 SAINT-AFFRIQUE</p>
                <span class="inline-block bg-slate-100 text-sr-blue font-bold px-6 py-2.5 rounded-full text-sm group-hover:bg-sr-blue group-hover:text-white transition-colors duration-300">
                    Accéder au site <i class="fa-solid fa-arrow-right ml-2"></i>
                </span>
            </a>

            <!-- Carte Rodez -->
            <a href="rodez.html" class="group bg-white p-10 rounded-3xl shadow-lg border border-slate-200 hover:shadow-2xl hover:-translate-y-2 hover:border-sr-orange transition-all duration-300 text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-sr-orange translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-in-out opacity-5"></div>
                <!-- LOGO AGRANDI pour garder l'équilibre visuel -->
                <div class="w-32 h-32 bg-orange-50 rounded-2xl flex items-center justify-center mx-auto mb-6 p-3 group-hover:scale-110 transition-transform duration-300">
                    <img src="images/logo-rodez.png" alt="Logo Rodez" class="h-full w-auto object-contain mix-blend-multiply">
                </div>
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Cabinet de Rodez</h2>
                <p class="text-slate-500 text-sm mb-6">5 bd Gambetta<br>12000 RODEZ</p>
                <span class="inline-block bg-slate-100 text-sr-orange font-bold px-6 py-2.5 rounded-full text-sm group-hover:bg-sr-orange group-hover:text-white transition-colors duration-300">
                    Accéder au site <i class="fa-solid fa-arrow-right ml-2"></i>
                </span>
            </a>

        </div>
    </div>

</body>
</html>
